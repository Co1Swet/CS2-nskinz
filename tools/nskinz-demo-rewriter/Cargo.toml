[package]
name = "nskinz-demo-rewriter"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
source2-demo = { path = "../../third_party/source2-demo/source2-demo", default-features = false, features = ["cs2"] }

[profile.release]
lto = "thin"
strip = true
